services:
  backend:
    platform: "linux/amd64"
    restart: always
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "8085:8080"
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./backend/src:/app
  frontend:
    platform: "linux/amd64"
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
